name: Ordo Fractum CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Unity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Test Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-tests-${{ runner.os }}-

      - name: Run Unity Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results-${{ github.run_number }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

  build:
    name: Windows Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Build Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-build-${{ runner.os }}-StandaloneWindows64-
            Library-build-${{ runner.os }}-

      - name: Set Build Metadata
        id: build_metadata
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Windows Game
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: OrdoFractum
          versioning: Custom
          version: 0.2.${{ github.run_number }}-${{ steps.build_metadata.outputs.short_sha }}

      - name: Hash Windows Executable
        id: executable_hash
        shell: bash
        run: |
          SHA256=$(sha256sum build/StandaloneWindows64/OrdoFractum.exe | awk '{print $1}')

          echo "=== OrdoFractum.exe SHA256 ==="
          echo "$SHA256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Submit Windows Executable to VirusTotal
        id: virustotal_upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          EXECUTABLE_SHA256: ${{ steps.executable_hash.outputs.sha256 }}
        run: |
          set -euo pipefail

          echo "Checking VirusTotal for existing file:"
          echo "${EXECUTABLE_SHA256}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output vt_file_response.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "https://www.virustotal.com/api/v3/files/${EXECUTABLE_SHA256}" \
            --header "x-apikey: ${VIRUSTOTAL_API_KEY}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "File already exists in VirusTotal."

            MALICIOUS=$(jq -r '.data.attributes.last_analysis_stats.malicious // 0' vt_file_response.json)
            SUSPICIOUS=$(jq -r '.data.attributes.last_analysis_stats.suspicious // 0' vt_file_response.json)
            UNDETECTED=$(jq -r '.data.attributes.last_analysis_stats.undetected // 0' vt_file_response.json)
            HARMLESS=$(jq -r '.data.attributes.last_analysis_stats.harmless // 0' vt_file_response.json)

            RESULT_COUNT=$(jq -r '
              (.data.attributes.last_analysis_results // {})
              | length
            ' vt_file_response.json)

            if [ "$RESULT_COUNT" -gt 0 ]; then
              echo "Using existing VirusTotal analysis."

              echo "=== VirusTotal Results ==="
              echo "SHA256:      ${EXECUTABLE_SHA256}"
              echo "Malicious:   $MALICIOUS"
              echo "Suspicious:  $SUSPICIOUS"
              echo "Undetected:  $UNDETECTED"
              echo "Harmless:    $HARMLESS"

              echo "=== VirusTotal Flagged Engines ==="

              FLAGGED_RESULTS=$(jq -r '
                (.data.attributes.last_analysis_results // {})
                | to_entries[]
                | select(
                    .value.category == "malicious" or
                    .value.category == "suspicious"
                  )
                | "\(.key): category=\(.value.category), result=\(.value.result // "N/A"), method=\(.value.method // "N/A"), engine_version=\(.value.engine_version // "N/A")"
              ' vt_file_response.json)

              if [ -n "$FLAGGED_RESULTS" ]; then
                echo "$FLAGGED_RESULTS"
              else
                echo "No malicious or suspicious engine results reported."
              fi

              GRIDINSOFT_KNOWN_FP=$(jq -r '
                (.data.attributes.last_analysis_results.Gridinsoft // {})
                | select(
                    .category == "malicious" and
                    .result == "Trojan.Win64.Downloader.oa!s1"
                  )
                | .result // ""
              ' vt_file_response.json)

              NON_WHITELISTED_MALICIOUS=$(jq -r '
                (.data.attributes.last_analysis_results // {})
                | to_entries
                | map(
                    select(
                      .value.category == "malicious" and
                      (
                        (.key == "Gridinsoft" and
                        .value.result == "Trojan.Win64.Downloader.oa!s1")
                        | not
                      )
                    )
                  )
                | length
              ' vt_file_response.json)

              if [ "$NON_WHITELISTED_MALICIOUS" -gt 0 ]; then
                echo "::error::VirusTotal reported ${NON_WHITELISTED_MALICIOUS} non-whitelisted malicious detection(s). Windows artifact will NOT be uploaded."
                exit 1
              fi

              if [ "$GRIDINSOFT_KNOWN_FP" = "Trojan.Win64.Downloader.oa!s1" ]; then
                echo "::warning::Ignoring known Gridinsoft false-positive signature: Trojan.Win64.Downloader.oa!s1"
              fi

              if [ "$SUSPICIOUS" -gt 0 ]; then
                echo "::warning::VirusTotal reported ${SUSPICIOUS} suspicious detection(s). Review before distribution."
              fi

              echo "VirusTotal reported no non-whitelisted malicious detections."
              echo "scan_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Existing VirusTotal file has no usable analysis results."
            echo "Requesting reanalysis."

            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --url "https://www.virustotal.com/api/v3/files/${EXECUTABLE_SHA256}/analyse" \
              --header "x-apikey: ${VIRUSTOTAL_API_KEY}")

            ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')

            if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
              echo "::error::VirusTotal did not return an analysis ID."
              echo "$RESPONSE"
              exit 1
            fi

            echo "scan_required=true" >> "$GITHUB_OUTPUT"
            echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

          elif [ "$HTTP_CODE" = "404" ]; then
            echo "File not found in VirusTotal."
            echo "Uploading executable."

            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --url "https://www.virustotal.com/api/v3/files" \
              --header "x-apikey: ${VIRUSTOTAL_API_KEY}" \
              --form "file=@build/StandaloneWindows64/OrdoFractum.exe")

            ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')

            if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
              echo "::error::VirusTotal did not return an analysis ID."
              echo "$RESPONSE"
              exit 1
            fi

            echo "VirusTotal upload successful."
            echo "scan_required=true" >> "$GITHUB_OUTPUT"
            echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

          else
            echo "::error::Unexpected VirusTotal lookup response: HTTP ${HTTP_CODE}"
            cat vt_file_response.json
            exit 1
          fi

      - name: Wait for VirusTotal Analysis
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.virustotal_upload.outputs.scan_required == 'true'
        shell: bash
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ANALYSIS_ID: ${{ steps.virustotal_upload.outputs.analysis_id }}
          EXECUTABLE_SHA256: ${{ steps.executable_hash.outputs.sha256 }}
        run: |
          set -euo pipefail

          echo "Analyzing executable SHA256: ${EXECUTABLE_SHA256}"

          MAX_ATTEMPTS=10
          POLL_INTERVAL=30

          for ((ATTEMPT=1; ATTEMPT<=MAX_ATTEMPTS; ATTEMPT++)); do
            echo "Waiting for VirusTotal analysis... attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

            sleep "$POLL_INTERVAL"

            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/${ANALYSIS_ID}" \
              --header "x-apikey: ${VIRUSTOTAL_API_KEY}")

            STATUS=$(echo "$RESPONSE" | jq -r '.data.attributes.status')

            echo "VirusTotal analysis status: ${STATUS}"

            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.malicious // 0')
              SUSPICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.suspicious // 0')
              UNDETECTED=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.undetected // 0')
              HARMLESS=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.harmless // 0')

              echo "=== VirusTotal Results ==="
              echo "SHA256:      ${EXECUTABLE_SHA256}"
              echo "Malicious:   $MALICIOUS"
              echo "Suspicious:  $SUSPICIOUS"
              echo "Undetected:  $UNDETECTED"
              echo "Harmless:    $HARMLESS"

              echo "=== VirusTotal Flagged Engines ==="

              FLAGGED_RESULTS=$(echo "$RESPONSE" | jq -r '
                (.data.attributes.results // {})
                | to_entries[]
                | select(
                    .value.category == "malicious" or
                    .value.category == "suspicious"
                  )
                | "\(.key): category=\(.value.category), result=\(.value.result // "N/A"), method=\(.value.method // "N/A"), engine_version=\(.value.engine_version // "N/A")"
              ')

              if [ -n "$FLAGGED_RESULTS" ]; then
                echo "$FLAGGED_RESULTS"
              else
                echo "No malicious or suspicious engine results reported."
              fi

              GRIDINSOFT_KNOWN_FP=$(echo "$RESPONSE" | jq -r '
                (.data.attributes.results.Gridinsoft // {})
                | select(
                    .category == "malicious" and
                    .result == "Trojan.Win64.Downloader.oa!s1"
                  )
                | .result // ""
              ')

              NON_WHITELISTED_MALICIOUS=$(echo "$RESPONSE" | jq -r '
                (.data.attributes.results // {})
                | to_entries
                | map(
                    select(
                      .value.category == "malicious" and
                      (
                        (.key == "Gridinsoft" and
                        .value.result == "Trojan.Win64.Downloader.oa!s1")
                        | not
                      )
                    )
                  )
                | length
              ')

              if [ "$NON_WHITELISTED_MALICIOUS" -gt 0 ]; then
                echo "::error::VirusTotal reported ${NON_WHITELISTED_MALICIOUS} non-whitelisted malicious detection(s). Windows artifact will NOT be uploaded."
                exit 1
              fi

              if [ "$GRIDINSOFT_KNOWN_FP" = "Trojan.Win64.Downloader.oa!s1" ]; then
                echo "::warning::Ignoring known Gridinsoft false-positive signature: Trojan.Win64.Downloader.oa!s1"
              fi

              if [ "$SUSPICIOUS" -gt 0 ]; then
                echo "::warning::VirusTotal reported ${SUSPICIOUS} suspicious detection(s). Review before distribution."
              fi

              echo "VirusTotal reported no non-whitelisted malicious detections."
              exit 0
            fi
          done

          echo "::error::VirusTotal analysis did not complete within the polling window."
          exit 1

      - name: Remove Non-Shipping Debug Files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          sudo rm -rf build/StandaloneWindows64/Ordo_Fractum_BurstDebugInformation_DoNotShip

      - name: Upload Windows Build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: OrdoFractum-0.2.${{ github.run_number }}-${{ steps.build_metadata.outputs.short_sha }}
          path: build/StandaloneWindows64
          retention-days: 30

      - name: Install itch.io Butler
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            -o butler.zip

          unzip -q butler.zip -d butler
          chmod +x butler/butler

          ./butler/butler -V

      - name: Deploy Windows Build to itch.io
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail

          ./butler/butler push \
            build/StandaloneWindows64 \
            greene11/ordo-fractum:windows \
            --userversion "0.2.${{ github.run_number }}-${{ steps.build_metadata.outputs.short_sha }}"
